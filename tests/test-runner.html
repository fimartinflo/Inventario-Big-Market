<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Runner - Inventario Big Market SPA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            color: #2c3e50;
            padding: 24px;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px 28px;
            border-radius: 10px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 1.4rem; }
        header span { font-size: 0.85rem; opacity: 0.7; }

        .summary-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .summary-card {
            flex: 1;
            background: white;
            border-radius: 10px;
            padding: 18px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .summary-card .number {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1;
        }

        .summary-card .label {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 4px;
        }

        .summary-card.total   .number { color: #2c3e50; }
        .summary-card.passed  .number { color: #27ae60; }
        .summary-card.failed  .number { color: #e74c3c; }
        .summary-card.rate    .number { color: #ffa00e; }

        .controls {
            margin-bottom: 24px;
        }

        .btn-run {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-run:hover { background: #1a252f; }
        .btn-run:disabled { background: #aaa; cursor: not-allowed; }

        .btn-filter {
            background: white;
            border: 1px solid #dee2e6;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-left: 8px;
            transition: all 0.2s;
        }

        .btn-filter.active {
            background: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }

        .progress-bar {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border-radius: 4px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .suite-group {
            background: white;
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        .suite-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            user-select: none;
        }

        .suite-header:hover { background: #f8f9fa; }

        .suite-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .suite-badge {
            font-size: 0.78rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .suite-badge.all-pass { background: #d4edda; color: #155724; }
        .suite-badge.has-fail { background: #f8d7da; color: #721c24; }
        .suite-badge.pending  { background: #e9ecef; color: #6c757d; }

        .test-list {
            display: none;
        }

        .suite-group.open .test-list { display: block; }

        .test-row {
            display: flex;
            align-items: flex-start;
            padding: 9px 18px 9px 32px;
            border-bottom: 1px solid #f8f9fa;
            font-size: 0.875rem;
            gap: 10px;
        }

        .test-row:last-child { border-bottom: none; }

        .test-icon { font-size: 0.9rem; flex-shrink: 0; margin-top: 1px; }
        .test-desc { flex: 1; color: #343a40; }
        .test-detail {
            font-size: 0.8rem;
            color: #dc3545;
            margin-top: 3px;
            font-family: monospace;
        }

        .test-row.pass { background: #fff; }
        .test-row.fail { background: #fff5f5; }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<header>
    <h1>🧪 Test Runner — Inventario Big Market SPA</h1>
    <span id="run-time">No ejecutado</span>
</header>

<div class="summary-bar">
    <div class="summary-card total">
        <div class="number" id="stat-total">—</div>
        <div class="label">Total</div>
    </div>
    <div class="summary-card passed">
        <div class="number" id="stat-passed">—</div>
        <div class="label">Pasaron</div>
    </div>
    <div class="summary-card failed">
        <div class="number" id="stat-failed">—</div>
        <div class="label">Fallaron</div>
    </div>
    <div class="summary-card rate">
        <div class="number" id="stat-rate">—</div>
        <div class="label">% Éxito</div>
    </div>
</div>

<div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
</div>

<div class="controls">
    <button class="btn-run" id="btn-run" onclick="executeTests()">▶ Ejecutar Pruebas</button>
    <button class="btn-filter active" id="filter-all"    onclick="applyFilter('all')">Todas</button>
    <button class="btn-filter"        id="filter-fail"   onclick="applyFilter('fail')">Solo Fallidas</button>
    <button class="btn-filter"        id="filter-pass"   onclick="applyFilter('pass')">Solo Pasadas</button>
</div>

<div id="results-container">
    <div class="no-results">Presiona "Ejecutar Pruebas" para comenzar</div>
</div>

<script src="unit-tests.js"></script>
<script>
    let lastResults = [];
    let currentFilter = 'all';

    const SUITE_NAMES = {
        'escapeHtml':                 '1. escapeHtml — Prevención XSS',
        'formatPrice':                '2. formatPrice — Formato de precios CLP',
        'parsePrice':                 '3. parsePrice — Parseo de precios',
        'parseDate':                  '4. parseDate — Parseo de fechas DD/MM/YYYY',
        'formatDate':                 '5. formatDate — Formato de fechas',
        'formatDateForInput':         '6. formatDateForInput — Fechas para inputs HTML',
        'convertInputDateToDisplay':  '7. convertInputDateToDisplay — Conversión de formatos',
        'getNextId':                  '8. getNextId — Generación de IDs',
        'Validación de stock':        '9. Validación de stock y cantidades',
        'Totales y vuelto de venta':  '10. Totales y cálculo de vuelto',
        'Filtros de ventas':          '11. Filtros y agrupación de ventas',
        'Validación de producto':     '12. Validación de datos de producto',
        'Backup y restauración':      '13. Backup: estructura y validación',
        'Casos de borde especiales':  '14. Casos de borde y roundtrips',
    };

    function detectSuite(description) {
        for (const key of Object.keys(SUITE_NAMES)) {
            if (description.toLowerCase().startsWith(key.toLowerCase().split(' ')[0])) {
                return SUITE_NAMES[key];
            }
        }
        return 'General';
    }

    function groupResultsBySuite(results) {
        const groups = {};
        for (const r of results) {
            const suite = detectSuite(r.description);
            if (!groups[suite]) groups[suite] = [];
            groups[suite].push(r);
        }
        return groups;
    }

    function applyFilter(filter) {
        currentFilter = filter;
        ['all', 'fail', 'pass'].forEach(f => {
            document.getElementById(`filter-${f}`).classList.toggle('active', f === filter);
        });
        renderResults(lastResults);
    }

    function renderResults(results) {
        const container = document.getElementById('results-container');
        if (!results || results.length === 0) {
            container.innerHTML = '<div class="no-results">No hay resultados</div>';
            return;
        }

        const filtered = results.filter(r => {
            if (currentFilter === 'fail') return !r.passed;
            if (currentFilter === 'pass') return r.passed;
            return true;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<div class="no-results">No hay pruebas que coincidan con el filtro "${currentFilter}"</div>`;
            return;
        }

        const groups = groupResultsBySuite(filtered);
        let html = '';

        for (const [suiteName, tests] of Object.entries(groups)) {
            const allPass = tests.every(t => t.passed);
            const hasTests = tests.length > 0;
            const badgeClass = !hasTests ? 'pending' : allPass ? 'all-pass' : 'has-fail';
            const badgeText  = !hasTests ? '—' : allPass
                ? `✓ ${tests.length}/${tests.length}`
                : `${tests.filter(t => t.passed).length}/${tests.length}`;

            html += `
                <div class="suite-group open">
                    <div class="suite-header" onclick="this.parentElement.classList.toggle('open')">
                        <span class="suite-title">${suiteName}</span>
                        <span class="suite-badge ${badgeClass}">${badgeText}</span>
                    </div>
                    <div class="test-list">
            `;

            for (const t of tests) {
                html += `
                    <div class="test-row ${t.passed ? 'pass' : 'fail'}">
                        <span class="test-icon">${t.passed ? '✓' : '✗'}</span>
                        <div>
                            <div class="test-desc">${t.description}</div>
                            ${t.detail ? `<div class="test-detail">${t.detail}</div>` : ''}
                        </div>
                    </div>
                `;
            }

            html += `</div></div>`;
        }

        container.innerHTML = html;
    }

    function executeTests() {
        const btn = document.getElementById('btn-run');
        btn.disabled = true;
        btn.textContent = '⏳ Ejecutando…';

        setTimeout(() => {
            const start = performance.now();
            const summary = runAllTests();
            const elapsed = ((performance.now() - start) / 1000).toFixed(3);

            lastResults = summary.results;

            document.getElementById('stat-total').textContent  = summary.total;
            document.getElementById('stat-passed').textContent = summary.passed;
            document.getElementById('stat-failed').textContent = summary.failed;
            document.getElementById('stat-rate').textContent   = summary.rate + '%';
            document.getElementById('progress-fill').style.width = summary.rate + '%';
            document.getElementById('run-time').textContent =
                `Ejecutado en ${elapsed}s — ${new Date().toLocaleTimeString('es-CL')}`;

            renderResults(lastResults);

            btn.disabled = false;
            btn.textContent = '▶ Ejecutar Pruebas';

            console.log(`\n📊 Resumen: ${summary.passed}/${summary.total} pruebas pasaron (${summary.rate}%)`);
        }, 50);
    }
</script>
</body>
</html>
